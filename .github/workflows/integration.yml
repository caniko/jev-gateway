name: integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-matrix:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.manifest.outputs.features }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: manifest
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const {prs} = JSON.parse(readFileSync('integration/manifest.json', 'utf8'));
          const features = prs.filter(p => p.state === 'pending').map(({id, headSha}) => {
            if (!Number.isInteger(id) || !/^[0-9a-f]{40}$/.test(headSha)) throw new Error('invalid manifest head');
            return {id, headSha};
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `features=${JSON.stringify(features)}\n`);
          JS

  feature-check:
    needs: feature-matrix
    name: PR ${{ matrix.feature.id }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15", "24"]
        feature: ${{ fromJSON(needs.feature-matrix.outputs.features) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.feature.headSha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
      # Candidate merges need *some* resolvable identity; the standard
      # ephemeral runner identity keeps operator config untouched.
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: node scripts/sync-master.mjs --check
        env:
          # gh needs an explicit token in Actions; read-only PR metadata.
          GH_TOKEN: ${{ github.token }}
      # No npm publish, no release-please, no secrets: integration pushes must
      # never trigger upstream releases. release.yml only runs on main.

  # Real binary acceptance on the integrated candidate: pinned OpenCode CLI
  # plus loopback model/MCP/Jev fixtures, no keys, no desktop, no publish.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/v2-acceptance.mjs --install-binary
        # --install-binary fetches only the pinned registry artifact and
        # Missing binary or any required BLOCKED check fails acceptance.
