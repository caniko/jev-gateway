name: integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-matrix:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.manifest.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: manifest
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const {prs} = JSON.parse(readFileSync('integration/manifest.json', 'utf8'));
          const features = prs.filter(p => p.state === 'pending').map(({id, headSha}) => {
            if (!Number.isInteger(id) || !/^[0-9a-f]{40}$/.test(headSha)) throw new Error('invalid manifest head');
            return {id, headSha};
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `features=${JSON.stringify(features)}\n`);
          JS

  feature-check:
    needs: feature-matrix
    name: PR ${{ matrix.feature.id }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15", "24"]
        feature: ${{ fromJSON(needs.feature-matrix.outputs.features) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.feature.headSha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
      # Candidate merges need *some* resolvable identity; the standard
      # ephemeral runner identity keeps operator config untouched.
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: node scripts/sync-master.mjs --check
        env:
          # gh needs an explicit token in Actions; read-only PR metadata.
          GH_TOKEN: ${{ github.token }}
      # No npm publish, no release-please, no secrets: integration pushes must
      # never trigger upstream releases. release.yml only runs on main.

  # Real binary acceptance on the integrated candidate: pinned OpenCode CLI
  # plus loopback model/MCP/Jev fixtures, no keys, no desktop, no publish.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir integration/qualification install --frozen-lockfile
      - run: node integration/qualification/v2-acceptance.mjs --install-binary
        # --install-binary fetches only the pinned registry artifact and
        # Missing binary or any required BLOCKED check fails acceptance.

  cold-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gateway
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caniko/opencode
          ref: 1b894b926a9e69a6211e3f0185d8f51d743a7f89
          path: runtime-source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gateway/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gateway/pnpm-lock.yaml
      - run: bun install --frozen-lockfile
        working-directory: runtime-source
      - run: bun test test/mcp.test.ts
        working-directory: runtime-source/packages/core
      - run: bun run build --single --skip-install --skip-web-ui
        working-directory: runtime-source/packages/cli
        env:
          OPENCODE_CHANNEL: jev-readiness
          OPENCODE_VERSION: 2.0.12-mcp.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir integration/qualification install --frozen-lockfile
      - run: pnpm build
      - name: Qualify the exact source-built executable
        run: |
          export OPENCODE_V2_BIN="$GITHUB_WORKSPACE/runtime-source/packages/cli/dist/cli-linux-x64/bin/opencode"
          export OPENCODE_V2_VERSION=2.0.12-mcp.1
          export OPENCODE_V2_SHA256="$(node --input-type=module -e 'import {createHash} from "node:crypto"; import {readFileSync} from "node:fs"; console.log(createHash("sha256").update(readFileSync(process.env.OPENCODE_V2_BIN)).digest("hex"));')"
          node integration/qualification/v2-cold-start.mjs
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.RUNNER_TEMP + "/runtime-pin.json", JSON.stringify({version:process.env.OPENCODE_V2_VERSION,sha256:process.env.OPENCODE_V2_SHA256,firstTurnReady:true,platform:process.platform,arch:process.arch,variant:"source-build"}));'
          node integration/qualification/v2-acceptance.mjs --runtime-pin="$RUNNER_TEMP/runtime-pin.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cold-readiness-evidence
          path: |
            ${{ runner.temp }}/runtime-pin.json
            /tmp/jev-cold-*/**/evidence.json
          retention-days: 7
